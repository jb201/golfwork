name: Publish swing journal
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test archive and planning
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          node --test tests/model.test.mjs
          python scripts/publish_session.py --validate
      - uses: actions/configure-pages@v5
      - name: Stage only the public journal
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r assets coach data sessions _site/
          find _site/sessions -type d -name sources -prune -exec rm -rf {} +
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4